<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K&Q Premium Product</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { 
    font-family: 'Roboto', sans-serif; 
    color:#f5f5f5; 
    line-height:1.6; 
    background: linear-gradient(135deg, #1c1c1c, #2e2e2e);
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: radial-gradient(circle at 20% 30%, rgba(255, 223, 0, 0.15), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.1), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05), transparent 50%);
    pointer-events: none;
    z-index:-1;
    animation: moveLights 15s linear infinite;
  }

  @keyframes moveLights {
    0% { transform: translate(0,0); }
    50% { transform: translate(-20px, 20px); }
    100% { transform: translate(0,0); }
  }

  .container { width:90%; max-width:1200px; margin:0 auto; padding:50px 0; }

  header { text-align:center; padding-bottom:40px; }
  header h1 { font-family: 'Playfair Display', serif; font-size:3rem; }
  header p { font-size:1.2rem; color:#ddd; }

  .shiny-border {
    border:8px solid;
    border-radius:12px;
    animation: goldShine 3s linear infinite;
    border-image-slice:1;
    box-shadow:0 15px 25px rgba(0,0,0,.35);
  }

  @keyframes goldShine {
    0% { border-image-source: linear-gradient(145deg,#b8860b,#ffd700,#e6c200); }
    50% { border-image-source: linear-gradient(145deg,#e6c200,#b8860b,#ffd700); }
    100% { border-image-source: linear-gradient(145deg,#b8860b,#ffd700,#e6c200); }
  }

  .product-section {
    display:flex;
    gap:30px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:50px;
  }

  .main-image { flex:0 0 450px; }
  .main-image img { width:100%; border-radius:12px; }

  .side-images {
    display:flex;
    flex-direction:column;
    gap:15px;
  }

  .side-images img {
    width:200px;
    height:130px;
    object-fit:cover;
    border-radius:10px;
  }

  .details { max-width:400px; }
  .details p { margin-bottom:20px; color:#ddd; }
  .price { font-size:2rem; color:#b8860b; margin-bottom:25px; }

  .btn {
    padding:15px 35px;
    font-weight:bold;
    border-radius:30px;
    cursor:pointer;
    text-transform:uppercase;
  }

  .btn-buy {
    background:linear-gradient(145deg,#b8860b,#ffd700,#e6c200);
    border:none;
    margin-right:15px;
  }

  .btn-wishlist {
    background:#2e2e2e;
    border:2px solid #b8860b;
    color:#b8860b;
  }

  /* ===== VIDEO (AJUSTE AQUI) ===== */
  .video-section { margin:50px 0; text-align:center; }

  .video-container {
    display:inline-block;
    width:80%;
    max-width:720px;
    border:8px solid;
    border-radius:12px;
    animation: goldShine 3s linear infinite;
    overflow:hidden;
    box-shadow:0 15px 25px rgba(0,0,0,.35);
  }

  .video-container video {
    width:100%;
    height:auto;
    display:block;
  }

  .testimonials {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
    margin-top:50px;
  }

  .testimonial {
    background:#2e2e2e;
    padding:25px;
    border-radius:12px;
  }

  .final-strip {
    display:flex;
    flex-wrap:wrap;
    justify-content:space-around;
    margin-top:70px;
    padding:20px;
    background:#2e2e2e;
    border-top:2px solid #b8860b;
    border-bottom:2px solid #b8860b;
  }

  footer {
    text-align:center;
    margin-top:50px;
    color:#aaa;
    font-size:.9rem;
  }

  @media(max-width:768px){
    .side-images { flex-direction:row; }
    .side-images img { width:30%; height:auto; }
    .video-container { width:95%; }
  }
</style>
</head>
<body>

<div class="container">

<header>
  <h1>K&Q Premium Collection</h1>
  <p>Discover the ultimate in elegance, quality, and style with K&Q.</p>
</header>

<section class="product-section">
  <div class="main-image shiny-border">
    <img src="https://raw.githubusercontent.com/TSTELLES/kingdom-quill/main/green.jpg">
  </div>

  <div class="side-images">
    <img class="shiny-border" src="https://raw.githubusercontent.com/TSTELLES/kingdom-quill/main/green.jpg">
    <img class="shiny-border" src="https://raw.githubusercontent.com/TSTELLES/kingdom-quill/main/green.jpg">
    <img class="shiny-border" src="https://raw.githubusercontent.com/TSTELLES/kingdom-quill/main/green.jpg">
  </div>

  <div class="details">
    <p>Our premium K&Q product combines cutting-edge design with unmatched craftsmanship.</p>
    <div class="price">$249.99</div>
    <button class="btn btn-buy">Buy Now</button>
    <button class="btn btn-wishlist">Add to Wishlist</button>
  </div>
</section>

<section class="video-section">
  <h2>See K&Q in Action</h2>
  <div class="video-container">
    <video controls>
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>
  </div>
</section>

<footer>
  &copy; 2025 K&Q. All rights reserved.
</footer>

</div>
</body>
</html>
